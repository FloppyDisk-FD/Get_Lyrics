name: Build FFmpeg & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-ffmpeg:
    name: Build FFmpeg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            exe: ffmpeg
          - os: macos-latest
            platform: macos-x64
            exe: ffmpeg
          - os: windows-latest
            platform: win-x64
            exe: ffmpeg.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm pkg-config curl xz-utils

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install yasm nasm pkg-config

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install yasm nasm --no-progress -y

      - name: Build FFmpeg
        shell: bash
        run: bash scripts/build-ffmpeg.sh

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist/ffmpeg-${{ matrix.platform }}
          cp bin/${{ matrix.exe }} dist/ffmpeg-${{ matrix.platform }}/
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -ttar ffmpeg-${{ matrix.platform }}.tar ffmpeg-${{ matrix.platform }}/
            7z a -tgzip ffmpeg-${{ matrix.platform }}.tar.gz ffmpeg-${{ matrix.platform }}.tar
          else
            tar -czf ffmpeg-${{ matrix.platform }}.tar.gz ffmpeg-${{ matrix.platform }}/
          fi
          ls -lh ffmpeg-${{ matrix.platform }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: dist/ffmpeg-${{ matrix.platform }}.tar.gz

  release:
    name: Create Release
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display structure
        run: ls -R dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true
